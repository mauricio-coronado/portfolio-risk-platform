[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riskplatform"
version = "0.1.0"
description = "Mixed-asset portfolio risk platform: exposure, attribution, risk metrics and stress testing"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mauricio Coronado" }]

dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.8,<4",
  "ipywidgets>=8.1",
  "jupyter>=1.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
riskplatform = "riskplatform.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/riskplatform"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PD", "RUF"]
ignore = [
  "E501",
  # .stack() here is the code whose pandas 3 behaviour was fixed deliberately.
  # Swapping it for .melt() would be a behaviour change dressed as a lint fix.
  "PD013",
  # Concatenation reads more clearly than unpacking in the bridge chart.
  "RUF005",
]